<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Lilies: Drawing Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&family=Unbounded:wght@300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Test page only: a wrapping grid of cards, one per drawing */
        .gallery { max-width: 960px; margin: 0 auto; padding: 16px; }
        .gallery h1, .gallery h2 { text-align: center; font-family: var(--display); font-weight: 300; text-shadow: 0 1px 3px rgba(90, 50, 80, 0.5); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .card { background: var(--card); border-radius: 20px; padding: 12px; text-align: center;
                box-shadow: 0 4px 12px rgba(200, 150, 160, 0.2); }
        .card svg { width: 100%; height: 160px; }
        .card p { margin: 6px 0 0; font-size: 0.9rem; color: var(--mauve); }
        /* bouquet layouts: bigger cards on the same mauve as the builder */
        .grid.big { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
        .card.dark { background: var(--panel); border: 1px solid var(--line); }
        .card.dark svg { height: 230px; }
        .card.dark p { color: var(--cream); }
    </style>
</head>
<body>
    <div class="gallery">
        <h1>Drawing gallery 🌷</h1>
        <div id="gallery-root"></div>
    </div>

    <script src="flowers.js"></script>
    <script src="bouquet.js"></script>
    <script>
        // ----- the hand-made bouquet layouts -----
        VIEWBOX.bouquet = "0 0 300 300";

        // n lilies split as evenly as possible over the 5 colors, e.g. 7 = 2, 2, 1, 1, 1
        function lilyCounts(n) {
            const counts = {};
            LILY_TYPES.forEach(function (type, i) {
                counts[type.key] = Math.floor(n / LILY_TYPES.length) + (i < n % LILY_TYPES.length ? 1 : 0);
            });
            return counts;
        }
        // the same number of every filler
        function fillerCounts(each) {
            const counts = {};
            FILLER_TYPES.forEach(function (type) { counts[type.key] = each; });
            return counts;
        }
        const LILY_NUMBERS = [1, 3, 6, 9, 12, 18];
        const WITH_FILLERS = [1, 2, 3, 4, 5, 6];   // how many of each filler goes with the lilies above

        // Each group: a title and a list of drawings (name, draw function, which viewBox to use)
        const groups = [
            { title: "Bouquet layouts: lilies only", big: true, items: LILY_NUMBERS.map(function (n) {
                return [n + (n === 1 ? " lily" : " lilies"), function () { return drawBouquet(lilyCounts(n), fillerCounts(0)); }, "bouquet"];
            }) },
            { title: "Bouquet layouts: lilies + fillers", big: true, items: LILY_NUMBERS.map(function (n, i) {
                return [n + (n === 1 ? " lily" : " lilies") + " + " + WITH_FILLERS[i] + " of each filler",
                    function () { return drawBouquet(lilyCounts(n), fillerCounts(WITH_FILLERS[i])); }, "bouquet"];
            }) },
            { title: "Filler layouts, 1 to 6 of each (with 12 lilies)", big: true, items: [].concat.apply([], FILLER_TYPES.map(function (type) {
                return [1, 2, 3, 4, 5, 6].map(function (count) {
                    return [type.label + " x " + count, function () {
                        const counts = fillerCounts(0);
                        counts[type.key] = count;
                        return drawBouquet(lilyCounts(12), counts);
                    }, "bouquet"];
                });
            })) },
            { title: "Lilies", items: [
                ["White lily", drawWhiteLily, "flower"],
                ["Stargazer pink lily", drawStargazerLily, "flower"],
                ["Orange lily", drawOrangeLily, "flower"],
                ["Yellow lily", drawYellowLily, "flower"],
                ["Blush pink lily", drawBlushLily, "flower"]
            ]},
            { title: "Filler flowers", items: [
                ["Baby's breath", drawBabysBreath, "flower"],
                ["Eucalyptus", drawEucalyptus, "flower"],
                ["Small daisies", drawDaisies, "flower"],
                ["Lavender", drawLavender, "flower"]
            ]},
            { title: "Wrapping paper", items: [
                ["Pink paper", function () { return drawWrapping({ color: "#f6c1cc" }); }, "wrapping"],
                ["Cream paper", function () { return drawWrapping({ color: "#f7e9c8" }); }, "wrapping"],
                ["Mint paper", function () { return drawWrapping({ color: "#b9e2cf" }); }, "wrapping"],
                ["Lavender paper", function () { return drawWrapping({ color: "#cdbdf0" }); }, "wrapping"]
            ]},
            { title: "Ribbon", items: [
                ["Rose ribbon", function () { return drawRibbon({ color: "#e2849b" }); }, "ribbon"],
                ["Gold ribbon", function () { return drawRibbon({ color: "#f2c14e" }); }, "ribbon"],
                ["Sky ribbon", function () { return drawRibbon({ color: "#7fb7e6" }); }, "ribbon"],
                ["White ribbon", function () { return drawRibbon({ color: "#ffffff" }); }, "ribbon"]
            ]}
        ];

        // Build the page from the list above
        const root = document.getElementById("gallery-root");
        groups.forEach(function (group) {
            let html = "<h2>" + group.title + "</h2><div class='grid" + (group.big ? " big" : "") + "'>";
            group.items.forEach(function (item) {
                html += "<div class='card" + (item[2] === "bouquet" ? " dark" : "") + "'>" + makeSvg(item[1](), VIEWBOX[item[2]]) + "<p>" + item[0] + "</p></div>";
            });
            root.innerHTML += html + "</div>";
        });
    </script>
</body>
</html>
